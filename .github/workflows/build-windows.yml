name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name IPCameraRecorder camera_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IPCameraRecorder-windows
          path: dist/IPCameraRecorder.exe
